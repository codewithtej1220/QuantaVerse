# Blueprint for the API and its database. The site itself goes to Vercel;
# only this half needs a container.
#
# Render's free web service has 512 MB of RAM, and importing qiskit, aer,
# cirq and pennylane together sits close to that. If the service restarts
# under load, either move to the 2 GB instance or drop cirq and pennylane
# from requirements.txt — the health endpoint degrades to whichever backends
# are installed, so nothing breaks by removing them.

services:
  - type: web
    name: quantaverse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QUANTAVERSE_JWT_SECRET
        generateValue: true
      - key: QUANTAVERSE_DATABASE_URL
        fromDatabase:
          name: quantaverse-db
          property: connectionString
      # Set this to the Vercel URL once the site is deployed. Leaving it as
      # "*" works, but it lets any origin call the API with a bearer token.
      - key: QUANTAVERSE_ALLOWED_ORIGINS
        sync: false
      - key: QUANTAVERSE_REGISTRATION_OPEN
        value: "1"
      # Optional. Without it the tutor falls back to its deterministic
      # Qiskit read-out, which is fully functional.
      #
      # The key is entered in the dashboard; the two values below are not
      # secret and belong here, because without them the model name would
      # silently stay at the OpenAI default and a Groq key would fail on every
      # request — visibly as nothing, since the tutor degrades quietly.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: QUANTAVERSE_TUTOR_MODEL
        value: openai/gpt-oss-120b
      # Reasoning models spend part of the budget thinking before they answer.
      - key: QUANTAVERSE_TUTOR_MAX_TOKENS
        value: "1200"

databases:
  - name: quantaverse-db
    plan: free
